# 游戏自动/全部签到用户白名单（显式授权，优先于游戏群黑名单）
QQ: []

# 米币签到白名单；名单中的QQ同时拥有游戏签到和米币签到权限
bbsQQ: []

# 米币签到黑名单；优先级高于米币QQ白名单和米币签到群白名单，不影响游戏签到权限
bbsQQBlack: []

# 游戏签到黑名单群；成员仅在同时属于至少一个非黑名单群时保留游戏签到权限
gameGroup: []

# 米币签到白名单群；群成员拥有米币签到权限，并自动拥有游戏签到权限（仍遵守游戏群黑名单）
bbsGroup: []

# 游戏自动签到时是否私聊通知第一个主人；关闭不影响游戏自动签到群推送
notifyMaster: true

# 游戏自动签到群推送名单
signPush: []

# 米币自动签到群推送名单
bbsPush: []
